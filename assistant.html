<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11131a">
<meta name="robots" content="noai, noimageai">
<title>Shop Assistant · ZAX LM SHOP</title>
<style>
:root{color-scheme:light dark;--page:#10131a;--surface:#171b24;--surface2:#1d232e;--ink:#f5f2e9;--muted:#a7a99f;--line:#343b47;--gold:#e8bf6b;--gold2:#f4d995;--goldink:#1b1710;--me:#b88936;--bot:#202733;--green:#5ac48e;--shadow:0 22px 70px #0006}
@media(prefers-color-scheme:light){:root{color-scheme:light;--page:#f4f1e8;--surface:#fffdf8;--surface2:#f7f3e9;--ink:#20242b;--muted:#6b706f;--line:#e6deca;--gold:#a87720;--gold2:#875d17;--goldink:#fff;--me:#a87720;--bot:#f2eee4;--shadow:0 22px 70px #3c2e1115}}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:radial-gradient(ellipse at 50% -20%,#5e47251a,transparent 55%),var(--page);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left)}button,input,a{font:inherit}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid color-mix(in srgb,var(--gold) 65%,transparent);outline-offset:2px}.app{width:min(100%,820px);height:100%;min-height:440px;background:var(--surface);display:flex;flex-direction:column;box-shadow:var(--shadow);overflow:hidden;border-inline:1px solid var(--line)}.topbar{display:flex;align-items:center;gap:13px;padding:13px 18px;background:var(--surface);border-bottom:1px solid var(--line);z-index:1}.logo{width:43px;height:43px;border-radius:13px;object-fit:cover;border:1px solid #c39a4e55;background:#111;flex:none}.brand{min-width:0;flex:1}.brand strong{font-size:15px;display:block;line-height:1.25}.brand small{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}.status-dot{height:7px;width:7px;border-radius:50%;background:var(--green);display:inline-block;flex:none}.top-actions{display:flex;gap:7px;align-items:center}.small-link,.iconbtn{border:1px solid var(--line);color:var(--ink);background:var(--surface);border-radius:10px;padding:7px 10px;cursor:pointer;font-size:12px;text-decoration:none;white-space:nowrap}.small-link:hover,.iconbtn:hover{border-color:var(--gold)}.intro{padding:12px 18px;background:linear-gradient(110deg,#d7ad5820,transparent 75%),var(--surface2);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}.intro b{color:var(--ink)}.price-status{float:right;color:var(--muted);font-size:11px}#log{flex:1;overflow-y:auto;padding:18px 16px 12px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}.row{display:flex;gap:8px;align-items:flex-end;max-width:100%}.row.me{align-self:flex-end;justify-content:flex-end}.row.bot{align-self:flex-start}.mini-avatar{width:25px;height:25px;flex:none;border-radius:9px;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;color:var(--gold);font-size:10px;font-weight:900;margin-bottom:2px}.bubble{max-width:min(88%,600px);padding:11px 14px;border-radius:17px;white-space:pre-wrap;overflow-wrap:anywhere}.row.bot .bubble{background:var(--bot);border:1px solid color-mix(in srgb,var(--line) 65%,transparent);border-bottom-left-radius:5px}.row.me .bubble{background:var(--me);color:#fff;border-bottom-right-radius:5px}.pic{display:block;width:100%;max-width:280px;margin-top:10px;border-radius:11px}.acts{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.act,.chips button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 11px;font-size:12px;font-weight:650;text-decoration:none;cursor:pointer;transition:transform .12s,border-color .12s}.act:hover,.chips button:hover{border-color:var(--gold);transform:translateY(-1px)}.act.primary{background:var(--gold);border-color:var(--gold);color:var(--goldink)}.repeatbar{display:flex;align-items:flex-start;gap:9px;padding:9px 17px;background:var(--surface2);border-top:1px solid var(--line);font-size:11px;color:var(--muted)}.repeatbar input{accent-color:var(--gold);margin:3px 0 0}.repeatbar strong{color:var(--ink)}.chips-wrap{padding:6px 14px 8px;border-top:1px solid var(--line);background:var(--surface)}.chips-label{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 2px 5px}.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}.chips button{flex:none;font-size:12px;font-weight:550;padding:7px 12px}.composer{display:flex;gap:9px;padding:10px 13px calc(12px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line)}.composer input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:14px;padding:11px 14px;outline:none}.composer input:focus{border-color:var(--gold)}.send{border:0;background:var(--gold);color:var(--goldink);border-radius:13px;padding:0 18px;font-weight:800;cursor:pointer}.send:hover{background:var(--gold2);color:#fff}.footnote{font-size:10px;color:var(--muted);text-align:center;padding:0 8px 8px;background:var(--surface)}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:520px){.topbar{padding:10px 12px}.intro{padding:9px 12px}.price-status{float:none;display:block;margin-top:3px}.bubble{max-width:90%;font-size:14px}.small-link,.iconbtn{padding:7px 8px}.composer{gap:7px}.send{padding:0 15px}#log{padding:14px 11px 10px}.logo{width:39px;height:39px}}
</style>
</head>
<body>
<main class="app" aria-label="ZAX LM SHOP assistant">
<header class="topbar"><img class="logo" src="logo.png" alt="ZAX LM SHOP logo"><div class="brand"><strong>ZAX LM SHOP · Assistant</strong><small><span class="status-dot"></span> Ready to help with the shop and your order</small></div><div class="top-actions"><a class="small-link" href="index.html#order">Open shop</a><button type="button" class="iconbtn" id="orderBtn" title="Show your shared shop order">Order <span id="cartCount">0</span></button></div></header>
<div class="intro"><b>Ask naturally.</b> Get help with current shop prices, services, and your order.<span id="priceStatus" class="price-status" role="status">Loading shop prices…</span></div>
<section id="log" aria-live="polite" aria-label="Conversation"></section>
<label class="repeatbar"><input type="checkbox" id="repeatToggle"><span><strong>Repeat order after 3 days</strong> · apply the shop’s 45% discount to bank bot attacks only. Tick this only if eligible; the seller confirms the order.</span></label>
<div class="chips-wrap"><div class="chips-label">Try asking</div><nav id="chips" class="chips" aria-label="Suggested questions"></nav></div>
<form id="f" class="composer" autocomplete="off"><label class="sr-only" for="q">Your message</label><input id="q" placeholder="Ask about prices, services, or your order…" autocomplete="off" enterkeyhint="send"><button class="send" id="send" type="submit">Send</button></form>
<div class="footnote">Price sheet syncs when online; built-in prices are used offline. Your shared order is saved in this browser.</div>
</main>
<script src="assistant.js" defer></script>
</body>
</html>
